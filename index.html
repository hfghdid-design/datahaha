
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tạo số điện thoại ảo Việt Nam</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
  padding: 40px 15px;
}
.container {
  max-width: 400px;
  margin: auto;
  background: #1e293b;
  padding: 25px;
  border-radius: 18px;
}
h2 { color: #38bdf8; }
.number {
  font-size: 27px;
  font-weight: bold;
  margin: 25px 0;
  color: #4ade80;
  letter-spacing: 2px;
}
select, button {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border: none;
  border-radius: 9px;
  font-size: 16px;
}
button {
  background: #0284c7;
  color: white;
  cursor: pointer;
}
button:hover { background: #0369a1; }
.copy { background: #16a34a; }
.note { color: #94a3b8; font-size: 12px; }
</style>
</head>
<body>

<div class="container">
  <h2>📱 SỐ ĐIỆN THOẠI VIỆT NAM</h2>

  <select id="network">
    <option value="all">Tất cả nhà mạng</option>
    <option value="viettel">Viettel</option>
    <option value="vina">Vinaphone</option>
    <option value="mobi">Mobifone</option>
    <option value="vietnamobile">Vietnamobile</option>
    <option value="gmobile">Gmobile</option>
  </select>

  <div class="number" id="result">09xxxxxxxx</div>

  <button onclick="generate()">🎲 Tạo số ngẫu nhiên</button>
  <button class="copy" onclick="copyNumber()">📋 Sao chép số</button>

  <p class="note">
    Đây là số giả lập ngẫu nhiên, không đảm bảo là số đang hoạt động.
    Không dùng để nhận SMS hoặc OTP.
  </p>
</div>

<script>
const networks = {
  viettel: ["032","033","034","035","036","037","038","039","086","096","097","098"],
  vina: ["081","082","083","084","085","088","091","094"],
  mobi: ["070","076","077","078","079","089","090","093"],
  vietnamobile: ["052","056","058","092"],
  gmobile: ["059","099"]
};

function generate() {
  const selected = document.getElementById("network").value;
  let prefixes = [];

  if (selected === "all") {
    prefixes = Object.values(networks).flat();
  } else {
    prefixes = networks[selected];
  }

  const prefix = prefixes[
    Math.floor(Math.random() * prefixes.length)
  ];

  let suffix = "";
  for (let i = 0; i < 7; i++) {
    suffix += Math.floor(Math.random() * 10);
  }

  document.getElementById("result").textContent =
    prefix + suffix;
}

function copyNumber() {
  const number = document.getElementById("result").textContent;
  navigator.clipboard.writeText(number)
    .then(() => alert("Đã sao chép: " + number))
    .catch(() => alert("Không thể sao chép số này."));
}
</script>

</body>
</html>
