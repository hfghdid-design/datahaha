
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quay số 501-999</title>
<style>
body {text-align:center;font-family:Arial;padding:30px}
h1 {font-size:40px;color:blue}
button {padding:15px 30px;font-size:20px}
</style>
</head>
<body>

<h2>QUAY SỐ 501 - 999</h2>
<h1 id="result">056***2768</h1>
<p id="count">Còn lại: 499 số</p>
<button onclick="quay()">QUAY SỐ</button>

<script>
let danhSach = Array.from(
    {length:499}, (_,i) => i + 501
);

function quay() {
    if (danhSach.length === 0) {
        alert("Đã quay hết 499 số!");
        return;
    }

    let viTri = Math.floor(Math.random() * danhSach.length);
    let so = danhSach.splice(viTri, 1)[0];

    let hienThi = String(so).padStart(3, '0');

    document.getElementById("result").innerText =
        "056" + hienThi + "2768";

    document.getElementById("count").innerText =
        "Còn lại: " + danhSach.length + " số";
}
</script>

</body>
</html>
